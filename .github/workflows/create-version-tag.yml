name: Create Version Tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "package.json"
      - ".github/workflows/create-version-tag.yml"
  workflow_dispatch:

jobs:
  tag-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [[ -z "${CURRENT_VERSION}" ]]; then
            echo "version is empty in package.json"
            exit 1
          fi

          BEFORE_SHA="${{ github.event.before }}"
          PREVIOUS_VERSION=""
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [[ "${BEFORE_SHA}" != "${ZERO_SHA}" ]] && git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            PREVIOUS_VERSION="$(git show "${BEFORE_SHA}:package.json" | node -p "const fs=require('node:fs'); const raw=fs.readFileSync(0,'utf8'); JSON.parse(raw).version || ''")"
          fi

          CHANGED="false"
          if [[ "${CURRENT_VERSION}" != "${PREVIOUS_VERSION}" ]]; then
            CHANGED="true"
          fi

          TAG_NAME="v${CURRENT_VERSION}"
          echo "current=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "previous=${PREVIOUS_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "changed=${CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Check tag exists on remote
        id: tag_exists
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q .; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi


      - name: Create and push tag
        if: steps.version.outputs.changed == 'true' && steps.tag_exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Build VSIX
        if: steps.version.outputs.changed == 'true' && steps.tag_exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run package:vsix

      - name: Create Release and upload VSIX
        if: steps.version.outputs.changed == 'true' && steps.tag_exists.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VSIX_FILE="$(ls *.vsix | head -1)"
          if [[ -z "${VSIX_FILE}" ]]; then
            echo "No .vsix file found after build"
            exit 1
          fi
          TAG_NAME="${{ steps.version.outputs.tag }}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG_NAME}^" 2>/dev/null || true)"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          MIGRATION_FILE="docs/configuration-migration.md"
          GENERATE_ARGS=(-f "tag_name=${TAG_NAME}")

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            GENERATE_ARGS+=(-f "previous_tag_name=${PREVIOUS_TAG}")
            DIFF_BASE="${PREVIOUS_TAG}"
          else
            # 首个版本及根提交以空树为差异基线。
            DIFF_BASE="$(git hash-object -t tree --stdin </dev/null)"
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${GENERATE_ARGS[@]}" --jq '.body' > "${NOTES_FILE}"

          # 仅在目标 tag 的差异包含迁移文档时附加；后续沿用文档的版本仅含自动 notes。
          MIGRATION_CHANGED="$(git diff --name-only "${DIFF_BASE}" "${TAG_NAME}" -- "${MIGRATION_FILE}")"
          if [[ -n "${MIGRATION_CHANGED}" ]] && git cat-file -e "${TAG_NAME}:${MIGRATION_FILE}" 2>/dev/null; then
            printf '\n\n---\n\n' >> "${NOTES_FILE}"
            git show "${TAG_NAME}:${MIGRATION_FILE}" >> "${NOTES_FILE}"
          fi

          gh release create "${TAG_NAME}" \
            --title "Release ${TAG_NAME}" \
            --notes-file "${NOTES_FILE}" \
            "${VSIX_FILE}"

      - name: Summary
        shell: bash
        run: |
          echo "Current version: ${{ steps.version.outputs.current }}"
          echo "Previous version: ${{ steps.version.outputs.previous }}"
          echo "Version changed: ${{ steps.version.outputs.changed }}"
          echo "Target tag: ${{ steps.version.outputs.tag }}"
          if [[ "${{ steps.version.outputs.changed }}" == "true" ]]; then
            echo "Tag already exists: ${{ steps.tag_exists.outputs.exists }}"
          fi
